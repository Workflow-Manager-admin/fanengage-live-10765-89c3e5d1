version: "3.8"
services:
  db:
    build: .
    container_name: football_engagement_database
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fanengage}
      POSTGRES_USER: ${POSTGRES_USER:-fanengage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanengagepwd}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./initdb/:/docker-entrypoint-initdb.d/
volumes:
  db_data:
